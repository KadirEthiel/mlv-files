<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>MLV MVP Season 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oxanium:wght@600;700;800&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --z0: #02040f;
            --z1: #060b1e;
            --z2: #0b1230;
            --z3: #111c44;
            --z4: #1a2860;
            --z5: #233580;
            --z6: #d99a18;
            --z7: #f2bd4b;
            --z8: #8aaeff;
            --z9: #c2d8ff;
            --za: #e8f2ff;
            --zb: #ffffff;
            --zc0: #080515;
            --zc1: #12062a;
            --zc2: #1e0b42;
            --zc3: #2d1265;
            --zc4: #3d1a8a;
            --zc5: #5a28d0;
            --zc6: #e6a800;
            --zc7: #a57dff;
            --zc8: #cdb8ff;
            --zg0: #ffdf40;
            --zg1: #ffc808;
            --zg2: #e6a800;
            --zr0: #d99a18;
            --zr1: #f2bd4b;
            --zt0: #00e8c8;
            --zt1: #4dfff0;
            --zm0: #f0c45a;
            --zm1: #ffe1a0;
            --zn0: rgba(90, 140, 255, .06);
            --zn1: rgba(90, 140, 255, .12);
            --zn2: rgba(90, 140, 255, .22);
            --zn3: rgba(90, 140, 255, .38);
            --zline: rgba(120, 160, 255, .14);
            --zline2: rgba(120, 160, 255, .08);
            --text: #ddeeff;
            --muted: #7a9bd4;
            --muted2: #3d5990;
            --ease: cubic-bezier(.22, .68, 0, 1.2);
            --easio: cubic-bezier(.4, 0, .2, 1);
            --r1: 12px;
            --r2: 18px;
            --r3: 26px;
            --r4: 40px;
        }

        html {
            overflow-x: hidden
        }

        html,
        body {
            min-height: 100%;
            font-family: 'Manrope', sans-serif;
            color: var(--text);
            background: var(--z0);
            -webkit-font-smoothing: antialiased
        }

        body {
            padding: 12px;
            background: radial-gradient(ellipse 80% 60% at 10% -10%, rgba(58, 92, 240, .28), transparent), radial-gradient(ellipse 60% 50% at 95% 5%, rgba(123, 79, 255, .22), transparent), radial-gradient(ellipse 50% 70% at 60% 110%, rgba(0, 232, 200, .12), transparent), linear-gradient(160deg, #02040f 0%, #060b1e 50%, #02040f 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 44px, rgba(120, 160, 255, .028) 44px, rgba(120, 160, 255, .028) 45px), repeating-linear-gradient(90deg, transparent, transparent 44px, rgba(120, 160, 255, .028) 44px, rgba(120, 160, 255, .028) 45px);
            mask-image: radial-gradient(ellipse at 50% 30%, rgba(0, 0, 0, .6), transparent 72%);
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: -25%;
            pointer-events: none;
            background: radial-gradient(circle at 20% 15%, rgba(58, 92, 240, .10), transparent 20%), radial-gradient(circle at 82% 20%, rgba(123, 79, 255, .08), transparent 18%), radial-gradient(circle at 65% 75%, rgba(0, 232, 200, .06), transparent 18%);
            animation: zFloat 14s ease-in-out infinite alternate;
            will-change: transform;
            z-index: 0;
        }

        @keyframes zFloat {
            from {
                transform: translate3d(-12px, -8px, 0)
            }

            to {
                transform: translate3d(12px, 10px, 0)
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px
        }

        ::-webkit-scrollbar-track {
            background: rgba(4, 8, 22, .8);
            border-radius: 99px
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--z6), var(--zc5));
            border-radius: 99px;
            border: 2px solid rgba(4, 8, 22, .8)
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--z7), var(--zc6))
        }

        ::-webkit-scrollbar-corner {
            background: transparent
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--z6) rgba(4, 8, 22, .8)
        }

        button,
        input,
        select {
            font-family: 'Manrope', sans-serif
        }

        .zs {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            gap: 10px
        }

        /* ── HERO ── */
        .zh-hero {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--zn3);
            border-radius: var(--r3);
            background: radial-gradient(ellipse 70% 100% at 80% 50%, rgba(58, 92, 240, .18), transparent), radial-gradient(ellipse 40% 60% at 8% 80%, rgba(0, 232, 200, .10), transparent), linear-gradient(135deg, rgba(10, 18, 46, .97), rgba(5, 8, 22, .98));
            box-shadow: 0 28px 100px rgba(0, 0, 0, .50), inset 0 1px 0 rgba(255, 255, 255, .05);
            padding: 18px 24px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
        }

        .zh-deco {
            position: absolute;
            right: -60px;
            top: -120px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            border: 1px solid rgba(90, 140, 255, .10);
            box-shadow: inset 0 0 80px rgba(90, 140, 255, .08);
            pointer-events: none
        }

        .zh-deco::after {
            content: "";
            position: absolute;
            inset: 40px;
            border-radius: 50%;
            border: 1px solid rgba(90, 140, 255, .07)
        }

        .zh-hex {
            position: absolute;
            right: 20px;
            top: 12px;
            opacity: .18;
            pointer-events: none
        }

        .zk {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font: 700 11px 'Space Mono', monospace;
            letter-spacing: 3px;
            color: var(--zt0);
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 232, 200, .5)
        }

        .zk::before {
            content: "";
            width: 28px;
            height: 2px;
            background: linear-gradient(90deg, var(--zt0), transparent);
            border-radius: 2px
        }

        .zt {
            font-family: 'Syne', sans-serif;
            font-size: 52px;
            line-height: .92;
            letter-spacing: -1px;
            margin-bottom: 10px
        }

        .zt span {
            background: linear-gradient(110deg, #fff 0%, #c2d8ff 30%, var(--z7) 60%, var(--zc6) 85%, var(--zm0) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px rgba(90, 140, 255, .25))
        }

        .zsub {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            font-weight: 500;
            max-width: 700px
        }

        .zh-stats {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-end
        }

        .zbadge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--zn2);
            background: linear-gradient(135deg, rgba(12, 22, 52, .85), rgba(6, 10, 24, .90));
            border-radius: var(--r2);
            padding: 8px 14px;
            font: 700 11px 'Space Mono', monospace;
            letter-spacing: 1px;
            color: var(--z8);
            white-space: nowrap;
            min-width: 130px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .04);
            transition: border-color .2s, box-shadow .2s
        }

        .zbdot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--z7);
            box-shadow: 0 0 12px var(--z7);
            flex-shrink: 0
        }

        .zbadge.zlive .zbdot {
            background: var(--zt0);
            box-shadow: 0 0 12px var(--zt0);
            animation: zpulse 1.8s ease-in-out infinite
        }

        .zbadge.zlive {
            color: var(--zt0);
            border-color: rgba(0, 232, 200, .28)
        }

        .zbadge.zerr .zbdot {
            background: var(--zr0);
            box-shadow: 0 0 8px var(--zr0)
        }

        .zbadge.zerr {
            color: var(--zr0);
            border-color: rgba(230, 177, 65, .34)
        }

        .zbval {
            font-size: 16px;
            font-family: 'Syne', sans-serif;
            color: var(--zb);
            line-height: 1
        }

        @keyframes zpulse {
            50% {
                transform: scale(1.5);
                opacity: .5
            }
        }

        /* ── NAV — now 4 tabs ── */
        .znav {
            display: flex;
            gap: 0;
            background: rgba(4, 8, 22, .6);
            border: 1px solid var(--zline);
            border-radius: var(--r2);
            padding: 6px;
            width: max-content;
            backdrop-filter: blur(10px);
        }

        .ztab {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 18px;
            border-radius: var(--r1);
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            font: 700 12px 'Manrope', sans-serif;
            letter-spacing: .3px;
            cursor: pointer;
            transition: all .22s var(--easio);
            white-space: nowrap
        }

        .ztab-ico {
            width: 18px;
            height: 18px;
            opacity: .7;
            transition: opacity .2s
        }

        .ztab:hover {
            color: var(--text);
            background: rgba(90, 140, 255, .08)
        }

        .ztab:hover .ztab-ico {
            opacity: 1
        }

        .ztab.zact {
            color: #fff;
            border-color: rgba(90, 140, 255, .5);
            background: linear-gradient(135deg, rgba(40, 80, 255, .9), rgba(30, 55, 180, .85));
            box-shadow: 0 0 32px rgba(90, 140, 255, .28), inset 0 1px 0 rgba(255, 255, 255, .12)
        }

        .ztab.zact .ztab-ico {
            opacity: 1
        }

        /* ── HOF tab gold accent ── */
        .ztab[data-tab="hof"].zact {
            background: linear-gradient(135deg, rgba(200, 140, 0, .9), rgba(140, 90, 0, .85));
            border-color: rgba(255, 213, 56, .55);
            box-shadow: 0 0 32px rgba(255, 213, 56, .22), inset 0 1px 0 rgba(255, 255, 255, .12);
        }

        .ztab[data-tab="hof"]:not(.zact):hover {
            background: rgba(255, 213, 56, .07);
            color: var(--zg0);
        }

        .ztab[data-tab="hof"]:not(.zact) .ztab-ico {
            color: rgba(255, 213, 56, .7)
        }

        /* ── CONTROLS ── */
        .zctrl {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            padding: 12px;
            background: linear-gradient(180deg, rgba(8, 14, 36, .82), rgba(4, 8, 20, .75));
            border: 1px solid var(--zline);
            border-radius: var(--r2);
            box-shadow: 0 16px 60px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .035);
            backdrop-filter: blur(8px)
        }

        .zctrl-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap
        }

        .zinput {
            flex: 1 1 240px;
            min-width: 0;
            height: 40px;
            padding: 0 14px 0 42px;
            border: 1px solid var(--zline);
            border-radius: var(--r1);
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%23f2bd4b' stroke-width='2' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='m20 20-3.5-3.5'/%3E%3C/svg%3E") 14px center/16px 16px no-repeat, rgba(3, 7, 20, .75);
            color: var(--text);
            font-weight: 700;
            font-size: 13px;
            outline: none;
            transition: border-color .18s, box-shadow .18s;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03)
        }

        .zinput::placeholder {
            color: var(--muted2)
        }

        .zinput:focus {
            border-color: rgba(90, 140, 255, .6);
            box-shadow: 0 0 0 3px rgba(90, 140, 255, .12)
        }

        .zfchips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 2px 0
        }

        .zfchip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid rgba(90, 140, 255, .22);
            background: rgba(3, 7, 20, .75);
            color: var(--muted);
            font: 700 11px 'Space Mono', monospace;
            letter-spacing: .6px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .2s var(--easio);
            white-space: nowrap;
            position: relative;
            overflow: hidden
        }

        .zfchip::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(90, 140, 255, .12), rgba(90, 140, 255, .04));
            opacity: 0;
            transition: opacity .2s
        }

        .zfchip:hover {
            color: var(--z8);
            border-color: rgba(90, 140, 255, .42)
        }

        .zfchip:hover::before {
            opacity: 1
        }

        .zfchip.zfact {
            color: #fff;
            border-color: rgba(90, 140, 255, .6);
            background: linear-gradient(135deg, rgba(40, 80, 255, .85), rgba(30, 55, 180, .8));
            box-shadow: 0 0 20px rgba(90, 140, 255, .22), inset 0 1px 0 rgba(255, 255, 255, .12)
        }

        .zfchip.zfact::before {
            opacity: 0
        }

        .zfchip-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            opacity: .7;
            flex-shrink: 0
        }

        .zfchip.zfact .zfchip-dot {
            opacity: 1;
            background: var(--zt0);
            box-shadow: 0 0 8px var(--zt0)
        }

        /* ── PODIUM ── */
        .zpod-wrap {
            display: grid;
            grid-template-columns: 1fr 1.06fr 1fr;
            gap: 14px;
            align-items: end;
            min-width: 0
        }

        .zpod {
            position: relative;
            overflow: visible;
            border: 1px solid var(--zline);
            border-radius: var(--r3);
            padding: 24px 20px 20px;
            background: radial-gradient(ellipse 80% 60% at 10% 0%, rgba(90, 140, 255, .16), transparent), linear-gradient(160deg, rgba(10, 18, 46, .95), rgba(4, 8, 20, .98));
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            gap: 8px;
            min-height: 180px;
            box-shadow: 0 16px 60px rgba(0, 0, 0, .24);
            transition: transform .28s var(--ease), box-shadow .28s var(--easio), border-color .22s;
            min-width: 0
        }

        .zpod::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: var(--r3);
            background: linear-gradient(180deg, rgba(255, 255, 255, .04), transparent 60%);
            pointer-events: none
        }

        .zpod::after {
            content: "";
            position: absolute;
            top: 0;
            left: 12px;
            right: 12px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(90, 140, 255, .4), transparent);
            border-radius: 2px
        }

        .zpod:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 40px rgba(90, 140, 255, .18), 0 28px 80px rgba(0, 0, 0, .34);
            border-color: rgba(90, 140, 255, .32)
        }

        .zpod.zp1 {
            border-color: rgba(255, 213, 56, .55);
            background: radial-gradient(ellipse 90% 50% at 50% -10%, rgba(255, 213, 56, .22), transparent), radial-gradient(ellipse 60% 70% at 8% 8%, rgba(255, 180, 0, .14), transparent), linear-gradient(160deg, rgba(26, 20, 8, .96), rgba(4, 8, 20, .98));
            box-shadow: 0 0 50px rgba(255, 213, 56, .14), 0 24px 80px rgba(0, 0, 0, .30);
            min-height: 210px;
            z-index: 2
        }

        .zpod.zp1::after {
            background: linear-gradient(90deg, transparent, rgba(255, 213, 56, .85), transparent)
        }

        .zpod.zp1:hover {
            box-shadow: 0 0 60px rgba(255, 213, 56, .22), 0 30px 90px rgba(0, 0, 0, .36);
            border-color: rgba(255, 213, 56, .8)
        }

        .zpod.zp3 {
            border-color: rgba(123, 79, 255, .45);
            background: radial-gradient(ellipse 70% 60% at 8% 0%, rgba(123, 79, 255, .18), transparent), linear-gradient(160deg, rgba(16, 10, 36, .96), rgba(4, 8, 20, .98));
            box-shadow: 0 0 38px rgba(123, 79, 255, .12), 0 18px 60px rgba(0, 0, 0, .26)
        }

        .zpod.zp3::after {
            background: linear-gradient(90deg, transparent, rgba(123, 79, 255, .7), transparent)
        }

        .zpod.zp3:hover {
            border-color: rgba(123, 79, 255, .7);
            box-shadow: 0 0 50px rgba(123, 79, 255, .20), 0 28px 80px rgba(0, 0, 0, .34)
        }

        .zcrown-wrap {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9
        }

        .zcrown-svg {
            width: 52px;
            height: auto;
            filter: drop-shadow(0 0 16px rgba(255, 213, 56, .9));
            animation: zcrownbob 3s ease-in-out infinite
        }

        @keyframes zcrownbob {
            50% {
                transform: translateY(-4px) scale(1.05)
            }
        }

        .zpod-rank {
            justify-self: start
        }

        .zrhex {
            display: inline-block;
            width: 68px;
            height: 68px;
            flex-shrink: 0
        }

        .zrhex svg {
            width: 100%;
            height: 100%
        }

        .zpod-score {
            justify-self: end;
            text-align: right;
            margin-top: -4px
        }

        .zpnum {
            font-family: 'Syne', sans-serif;
            font-size: 52px;
            line-height: .88;
            color: var(--z7);
            text-shadow: 0 0 24px rgba(90, 140, 255, .3)
        }

        .zpod.zp1 .zpnum {
            color: var(--zg0);
            text-shadow: 0 0 28px rgba(255, 213, 56, .35)
        }

        .zpod.zp3 .zpnum {
            color: var(--zc7)
        }

        .zplbl {
            font: 700 10px 'Space Mono', monospace;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin-top: 3px
        }

        .zpod.zp1 .zplbl {
            color: rgba(255, 213, 56, .7)
        }

        .zpod.zp3 .zplbl {
            color: rgba(165, 125, 255, .7)
        }

        .zpname {
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0
        }

        .zppills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
            align-self: end
        }

        /* ── TABLE ── */
        .ztable-wrap {
            border: 1px solid var(--zline);
            border-radius: var(--r3);
            background: linear-gradient(180deg, rgba(9, 16, 40, .95), rgba(4, 8, 20, .98));
            overflow-x: auto;
            overflow-y: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .30), inset 0 1px 0 rgba(255, 255, 255, .04);
            margin-top: 10px
        }

        .ztable {
            display: grid
        }

        .zrow {
            display: grid;
            grid-template-columns: 60px minmax(0, 1.8fr) minmax(0, 1.1fr) minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1.1fr) 72px;
            gap: 0;
            align-items: stretch;
            min-height: 68px;
            padding: 0 12px;
            border-bottom: 1px solid var(--zline2);
            transition: background .16s var(--easio);
            contain: layout style
        }

        .zrow.zrs {
            grid-template-columns: 60px minmax(0, 1.8fr) minmax(0, 1.2fr) minmax(0, 1.4fr) 72px;
            align-items: stretch;
            contain: layout style
        }

        /* ── HOF table row — Rank | Player | Points (3 cols) ── */
        .zrow.zhof {
            grid-template-columns: 60px minmax(0, 1fr) 120px !important;
            contain: layout style;
        }

        .zrow:not(.zrh):hover {
            background: linear-gradient(90deg, rgba(90, 140, 255, .08), rgba(90, 140, 255, .02))
        }

        .zrow.zrh {
            min-height: 52px;
            background: linear-gradient(180deg, rgba(10, 20, 50, .97), rgba(7, 13, 32, .97));
            font: 700 11px 'Space Mono', monospace;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--z7);
            position: sticky;
            top: 0;
            z-index: 3
        }

        /* gold header for HOF */
        .zrow.zhof.zrh {
            color: var(--zg0)
        }

        .zrow>span {
            height: auto;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 16px
        }

        .zrow>span:not(:last-child) {
            border-right: 1px solid rgba(120, 160, 255, .10)
        }

        .zrow.zrh>span:not(:last-child) {
            border-right: 1px solid rgba(120, 160, 255, .07)
        }

        .zrrank {
            display: flex;
            align-items: center;
            justify-content: center
        }

        .zrrank svg {
            width: 58px;
            height: 58px;
            flex-shrink: 0
        }

        .zrplayer {
            display: grid;
            gap: 3px;
            justify-items: center;
            text-align: center;
            padding: 12px 18px !important
        }

        .zrplayer b {

.zpod.zp1 { border-color:rgba(255,220,120,.62) !important; background:radial-gradient(ellipse 90% 52% at 50% -10%,rgba(255,213,86,.22),transparent),linear-gradient(160deg,rgba(48,34,9,.98),rgba(10,8,4,.99)) !important; }
.zpill { --pc1:#e3b34f; --pc2:#a96e12; --pfg:#fff2cf; --prim:rgba(230,177,65,.32); }
.zpill.znil { color:#806b42 !important; border-color:rgba(230,177,65,.12) !important; }
.zpill.zplibero,.zpill.zpspiker,.zpill.zps4,.zpill.zppotw,.zpill.zpmop {
  --pc1:#f1ca70; --pc2:#bd7d18; --pfg:#fff4d8; --prim:rgba(230,177,65,.34);
}
.zpill.zpds,.zpill.zpchamp,.zpill.zps1,.zpill.zps2,.zpill.zps3,.zpill.zps5,.zpill.zps6,.zpill.zpsetter,.zpill.zpmdp,.zpill.zps {
  --pc1:#e5bd68; --pc2:#a9781d; --pfg:#fff3d5; --prim:rgba(230,177,65,.30);
}
.zpill.zpallstar,.zpill.zpfinalmvp,.zpill.zpsemifinalmvp,.zpill.zpleaguemvp,.zpill.zpmvp,.zpill.zpt,.zpill.zpk,.zpill.zpotw {
  --pc1:#ffe3a0; --pc2:#d49a2d; --pfg:#fff7e6; --prim:rgba(245,195,84,.36);
}
.zpill:hover { filter:brightness(1.08); }
.zrrank svg polygon,.zrhex svg polygon { fill:rgba(217,154,36,.13) !important; stroke:rgba(245,195,84,.68) !important; }
.zrrank svg text,.zrhex svg text { fill:#f5d17a !important; }
.zfooter { color:#8b713b !important; }
::-webkit-scrollbar-track { background:rgba(10,8,4,.9) !important; }
::-webkit-scrollbar-thumb { background:linear-gradient(180deg,#e0aa32,#9a6410) !important; border-color:rgba(10,8,4,.9) !important; }

</head>
<body>
<div class="zs">
<header class="zh-hero">
  <div class="zh-deco"></div>
  <svg class="zh-hex" width="340" height="220" viewBox="0 0 340 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="s11Gold" x1="60" y1="20" x2="280" y2="200" gradientUnits="userSpaceOnUse">
        <stop stop-color="#FFF0B8"/><stop offset=".48" stop-color="#E6B34A"/><stop offset="1" stop-color="#9D6815"/>
      </linearGradient>
      <radialGradient id="s11Glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 112) rotate(90) scale(96 130)">
        <stop stop-color="#E9B84E" stop-opacity=".24"/><stop offset="1" stop-color="#E9B84E" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="170" cy="112" rx="132" ry="89" fill="url(#s11Glow)"/>
    <g stroke="url(#s11Gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".82">
      <path d="M82 169C47 146 42 102 57 66C63 51 73 39 86 29"/>
      <path d="M258 169C293 146 298 102 283 66C277 51 267 39 254 29"/>
      <path d="M78 157C61 153 51 143 45 129M69 137C54 128 48 115 47 101M66 111C57 99 57 84 62 72M82 83C74 69 77 53 88 42"/>
      <path d="M262 157C279 153 289 143 295 129M271 137C286 128 292 115 293 101M274 111C283 99 283 84 278 72M258 83C266 69 263 53 252 42"/>
      <path d="M78 157C88 143 91 128 88 112M69 137C82 125 87 110 84 94M66 111C78 98 81 84 76 68M82 83C93 73 98 60 94 47"/>
      <path d="M262 157C252 143 249 128 252 112M271 137C258 125 253 110 256 94M274 111C262 98 259 84 264 68M258 83C247 73 242 60 246 47"/>
      <path d="M99 165C121 177 143 182 170 182C197 182 219 177 241 165" opacity=".58"/>
      <path d="M116 88L127 55L151 77L170 34L189 77L213 55L224 88L216 126H124L116 88Z" fill="rgba(224,170,50,.10)"/>
      <path d="M124 126H216L211 145H129L124 126Z" fill="rgba(224,170,50,.12)"/>
      <path d="M135 145V153H205V145"/>
      <path d="M127 102H213" opacity=".52"/>
    </g>
    <g fill="#FFE6A1" stroke="#C28A24" stroke-width="1">
      <circle cx="151" cy="77" r="4.2"/><circle cx="170" cy="34" r="5"/><circle cx="189" cy="77" r="4.2"/>
      <path d="M170 8L173.5 18.5L184 22L173.5 25.5L170 36L166.5 25.5L156 22L166.5 18.5L170 8Z"/>
      <path d="M104 48L106 54L112 56L106 58L104 64L102 58L96 56L102 54L104 48Z"/>
      <path d="M236 48L238 54L244 56L238 58L236 64L234 58L228 56L234 54L236 48Z"/>

    <g fill="#DCA63A" opacity=".8"><circle cx="106" cy="181" r="2.5"/><circle cx="234" cy="181" r="2.5"/><circle cx="48" cy="87" r="2"/><circle cx="292" cy="87" r="2"/></g>
  </svg>
  <div><div class="zk">MLV Information</div><h1 class="zt"><span>MLV MVP Season 11</span></h1><p class="zsub">MLV MVP Season 11 · Season leaderboard and player points.</p></div>
  <div class="zh-stats"><div class="zbadge" id="zsync"><div class="zbdot"></div><span>SYNCING</span></div><div class="zbadge"><span class="zbval" id="ztotal">0</span><span>PLAYERS</span></div><div class="zbadge"><span>🏆</span><span>MVP LEADERBOARD</span></div></div>
</header>
<nav class="znav"><button class="ztab zact" data-tab="mvp"><svg class="ztab-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 15.1 8.4 22 9.4l-5 4.9 1.2 6.9L12 17.9 5.8 21.2 7 14.3 2 9.4l6.9-1L12 2Z"/></svg>MLV MVP Season 11</button></nav>
<section class="zctrl"><input class="zinput" id="zsearch" placeholder="Search player or team…" /></section>
<section class="ztable-wrap"><div class="ztable" id="mvpTable"><div class="zloading">Loading MLV MVP Season 11…</div></div></section>
<footer class="zfooter">Made by Fuas · MLV MVP Season 11 · 2026</footer>
</div>
<script>
  // Endpoint exclusivo de la temporada mostrada.
  const MVP_API_URL = "PASTE_S11_WEB_APP_URL_HERE";
  const MVP_SEASON = "11";
  const $ = id => document.getElementById(id);
  const clean = v => String(v ?? '').trim();
  const pick = (obj, keys) => { for (const key of keys) if (obj[key] != null && clean(obj[key])) return obj[key]; return ''; };
  const esc = value => clean(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function normalizePlayer(row) {
    return {
      name: clean(pick(row, ['name','player','players','Player','Players','PLAYER','PLAYERS','PLAYER NAME'])),
      team: clean(pick(row, ['team','Team','TEAM','teams','TEAMS'])),
      top1: clean(pick(row, ['top1','TOP1','Top 1','top 1','TOP 1'])),
      top2: clean(pick(row, ['top2','TOP2','Top 2','top 2','TOP 2'])),
      top3: clean(pick(row, ['top3','TOP3','Top 3','top 3','TOP 3'])),
      top4: clean(pick(row, ['top4','TOP4','Top 4','top 4','TOP 4'])),
      top5: clean(pick(row, ['top5','TOP5','Top 5','top 5','TOP 5'])),
      potw: clean(pick(row, ['potw','POTW','Player of the Week','PLAYER OF THE WEEK','Player of Week'])),
      points: Number(pick(row, ['points','Points','POINTS','Total Points','TOTAL POINTS','totalPoints','total_points','Total','TOTAL','Pts','PTS']) || 0) || 0
    };
  }

  function extractRows(payload) {
    if (Array.isArray(payload)) return payload;
    if (!payload || typeof payload !== 'object') return [];
    const aliases = MVP_SEASON === '11'
      ? ['mvpsS11','season11','seasonS11','MVP Season 11','data']
      : ['mvpsSX','seasonX','mvpsS10','season10','mvpsS9','mvpS9','mvps9','mvp9','Season X','data'];
    return pick(payload, aliases) || [];
  }

  function pillHTML(value) {
    const text = clean(value);
    if (!text) return '<span class="zpill znil">—</span>';
    return text.split(',').map(chunk => {
      const match = chunk.trim().match(/^(\d+)\s*x\s*(.*)$/i);
      const qty = match ? match[1] : '1';
      const role = match ? match[2].trim() : chunk.trim();
      const lower = role.toLowerCase();
      let cls = 'zpill';
      if (lower.includes('setter')) cls += ' zps';
      else if (lower.includes('spiker')) cls += ' zpk';
      else if (lower.includes('potw')) cls += ' zpotw';
      else cls += ' zpt';
      return `<span class="${cls}"><b>${esc(qty)}x</b> ${esc(role)}</span>`;
    }).join('');
  }

  function rankHex(rank) {
    const n = String(rank), fs = n.length <= 2 ? 20 : n.length <= 3 ? 15 : 11;
    return `<div class="zrhex"><svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><polygon points="30,3.5 56.5,17.75 56.5,42.25 30,56.5 3.5,42.25 3.5,17.75" fill="rgba(217,154,36,.13)" stroke="rgba(245,195,84,.68)" stroke-width="2.2"/><text x="30" y="30" text-anchor="middle" dy=".36em" font-family="Space Mono,monospace" font-size="${fs}" font-weight="800" fill="#f5d17a">#${n}</text></svg></div>`;
  }

  function setStatus(text, error=false) {
    const el = $('zsync');
    el.innerHTML = `<div class="zbdot"></div><span>${esc(text)}</span>`;
    el.className = 'zbadge' + (error ? ' zerr' : '');
  }

  function render() {
    const query = $('zsearch').value.toLowerCase().trim();
    const rows = [...MVP_ROWS].filter(p => !query || Object.values(p).join(' ').toLowerCase().includes(query))
      .sort((a,b) => b.points-a.points || a.name.localeCompare(b.name));
    const head = `<div class="zrow zmvp zrh"><span>Rank</span><span>Player</span><span>TOP 1</span><span>TOP 2</span><span>TOP 3</span><span>TOP 4</span><span>TOP 5</span><span>POTW</span><span>Points</span></div>`;
    if (!MVP_ROWS.length) {
      $('mvpTable').innerHTML = '<div class="zempty">No player data found for this season yet.</div>';
      return;
    }
    if (!rows.length) {
      $('mvpTable').innerHTML = head + '<div class="zempty">No players match your search.</div>';
      return;
    }
    $('mvpTable').innerHTML = head + rows.map((p,i) => `
      <div class="zrow zmvp">
        <span class="zrrank">${rankHex(i+1)}</span>
        <span class="zrplayer"><b>${esc(p.name)}</b>${p.team ? `<span class="zrteam">${esc(p.team)}</span>` : ''}</span>
        <span class="zrcell">${pillHTML(p.top1)}</span>
        <span class="zrcell">${pillHTML(p.top2)}</span>
        <span class="zrcell">${pillHTML(p.top3)}</span>
        <span class="zrcell">${pillHTML(p.top4)}</span>
        <span class="zrcell">${pillHTML(p.top5)}</span>
        <span class="zrcell">${pillHTML(p.potw)}</span>
        <span class="zrtotal">${p.points}</span>
      </div>`).join('');
  }

  let MVP_ROWS = [];
  async function syncMVP() {
    if (!MVP_API_URL || MVP_API_URL.includes('PASTE_')) {
      setStatus('API NOT SET', true);
      $('mvpTable').innerHTML = '<div class="zempty">Paste the deployed Apps Script Web App URL into MVP_API_URL.</div>';
      return;
    }
    setStatus('SYNCING');
    try {
      const response = await fetch(MVP_API_URL, {method:'GET',cache:'no-store',redirect:'follow'});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const payload = await response.json();
      MVP_ROWS = extractRows(payload).map(normalizePlayer).filter(p => p.name);
      $('ztotal').textContent = MVP_ROWS.length;
      render();
      setStatus('LIVE · SYNCED');
    } catch (error) {
      console.error(`${MVP_SEASON} MVP API error:`, error);
      setStatus('API ERROR', true);
      $('mvpTable').innerHTML = '<div class="zempty">Could not load the season data. Check the Apps Script Web App URL and deployment access.</div>';
    }
  }
  $('zsearch').addEventListener('input', render);
  syncMVP();
</script>
